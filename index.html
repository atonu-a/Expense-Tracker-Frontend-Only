<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>এক্সপেন্স ট্রাকার</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header class="nav">
    <h1>💰 ট্রাকার</h1>
    <nav>
      <a href="index.html" class="active">হোম</a>
      <a href="profile.html">প্রোফাইল</a>
    </nav>
  </header>

  <main class="container">
    <section class="card balance">
      <span>ব্যালেন্স</span>
      <h2 id="balance">৳0</h2>
    </section>

    <section class="card month">
      <span>এই মাসের খরচ (<small id="monthName"></small>)</span>
      <h3 id="monthExpense">৳0</h3>
    </section>

    <button id="openModal" class="btn primary big">＋ যোগ করুন</button>

    <h4 class="section-title">সাম্প্রতিক লেনদেন</h4>
    <ul id="txList" class="tx-list"></ul>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>নতুন এন্ট্রি</h3>
      <div class="toggle">
        <button type="button" data-type="expense" class="active">খরচ</button>
        <button type="button" data-type="income">ইনকাম</button>
      </div>
      <input type="number" id="amount" placeholder="এমাউন্ট" min="1" step="any">
      <input type="text" id="note" placeholder="নোট (ঐচ্ছিক)">
      <p id="modalError" class="error"></p>
      <div class="row">
        <button id="cancelBtn" class="btn">বাতিল</button>
        <button id="saveBtn" class="btn primary">সেভ</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

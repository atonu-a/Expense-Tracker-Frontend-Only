<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register" class="auth">
  <form id="registerForm" class="card auth-box">
    <h2>Register</h2>
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password (Atleast 6 characters)" required>
    <p id="error" class="error"></p>
    <button class="btn primary" type="submit">Create Account</button>
    <p class="muted">Already have an account? <a href="login.html">Login</a></p>
  </form>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>লগইন</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login" class="auth">
  <form id="loginForm" class="card auth-box">
    <h2>লগইন</h2>
    <input type="email" id="email" placeholder="ইমেইল" required>
    <input type="password" id="password" placeholder="পাসওয়ার্ড" required>
    <p id="error" class="error"></p>
    <button class="btn primary" type="submit">লগইন</button>
    <p class="muted">একাউন্ট নেই? <a href="register.html">রেজিস্টার করুন</a></p>
  </form>
  <script src="app.js"></script>
</body>
</html>
